<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">Sprint 1 — pontos não concluídos nos registros documentais</title>
  <desc id="desc">Registro anterior: 36 pontos não concluídos. Atualização de 15 de outubro: 33. Total planejado: 120 pontos; 87 concluídos, 18 em andamento e 15 não iniciados. Não há interpolação de dias sem dados.</desc>
  <rect width="900" height="380" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="36" y="36" font-size="22" font-weight="bold">Sprint 1 — Burndown</text>
    <text x="36" y="62" font-size="14">Pontos não concluídos = em andamento + não iniciados</text>
    <g stroke="#cbd5e1" stroke-width="1">
      <path d="M100 90H800 M100 130H800 M100 170H800 M100 210H800 M100 250H800"/>
      <path d="M100 90V250H800" stroke="#64748b"/>
    </g>
    <g font-size="13" text-anchor="end">
      <text x="88" y="95">40</text><text x="88" y="135">30</text>
      <text x="88" y="175">20</text><text x="88" y="215">10</text><text x="88" y="255">0</text>
    </g>
    <path d="M240 106L660 118" fill="none" stroke="#0f766e" stroke-width="4"/>
    <circle cx="240" cy="106" r="6" fill="#0f766e"/><circle cx="660" cy="118" r="6" fill="#0f766e"/>
    <g text-anchor="middle">
      <text x="240" y="94" font-size="16" font-weight="bold">36</text>
      <text x="660" y="106" font-size="16" font-weight="bold">33</text>
      <text x="240" y="276" font-size="14">Registro anterior</text>
      <text x="660" y="276" font-size="14">Atualização 15/10/2026</text>
    </g>
    <text x="36" y="316" font-size="15">Total: 120 · Concluídos: 87 · Em andamento: 18 · Não iniciados: 15</text>
    <text x="36" y="346" font-size="13" fill="#475569">Comparação dos registros disponíveis; não representa uma série diária nem a nota da rubrica.</text>
  </g>
</svg>
