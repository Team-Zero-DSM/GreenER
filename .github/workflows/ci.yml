name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: greener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d greener_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/greener_test
      JWT_SECRET: segredo-so-para-ci
      NODE_ENV: test

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Criar tabelas do banco de testes
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/schema.sql

      - name: Verificar lint
        run: npm run lint --if-present

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Compilar backend
        run: npm run build

      - name: Executar testes
        run: npm test --if-present

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint --if-present

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Compilar frontend
        run: npm run build

      - name: Executar testes
        run: npm test --if-present

