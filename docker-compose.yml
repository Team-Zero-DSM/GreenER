name: greener

services:
    database:
        image: postgres:17-bookworm
        environment:
            POSTGRES_DB: greener
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        networks:
            - greener

volumes:
    postgres_data:

networks:
    greener:
        driver: bridge
